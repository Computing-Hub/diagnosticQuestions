strand: Number
topic: Factors, multiples & primes
order: 4
questions:
  - id: fmp-01
    year_group: 7
    stem: 'Which list shows all the prime numbers less than $10$?'
    options:
      A: '$1,\ 3,\ 5,\ 7,\ 9$'
      B: '$3,\ 5,\ 7$'
      C: '$2,\ 3,\ 5,\ 7$'
      D: '$1,\ 2,\ 3,\ 5,\ 7$'
    correct: C
    misconceptions:
      A:
        label: 'Thinks prime means odd'
        explanation: 'Lists the odd numbers, including 1 and 9, and leaves out 2.'
      B:
        label: 'Thinks 2 is not prime because it is even'
        explanation: 'Believes no even number can be prime.'
      D:
        label: 'Thinks 1 is a prime number'
        explanation: 'Does not know a prime has exactly two factors; 1 has only one.'
    worked_answer:
      option: B
      steps:
        - 'Cross out $1$, and $9 = 3 \times 3$'
        - 'Cross out $2,\ 4,\ 6,\ 8$ because they divide by 2'
        - '$3,\ 5,\ 7$'
  - id: fmp-02
    year_group: 7
    stem: 'Which list shows all the factors of $12$?'
    options:
      A: '$2,\ 3,\ 4,\ 6$'
      B: '$2,\ 3$'
      C: '$12,\ 24,\ 36,\ 48$'
      D: '$1,\ 2,\ 3,\ 4,\ 6,\ 12$'
    correct: D
    misconceptions:
      A:
        label: 'Leaves out 1 and the number itself'
        explanation: 'Thinks 1 and 12 do not count as factors of 12.'
      B:
        label: 'Confuses factors with prime factors'
        explanation: 'Lists only the prime numbers that divide 12.'
      C:
        label: 'Confuses factors with multiples'
        explanation: 'Lists numbers in the 12 times table instead of numbers that divide 12.'
    worked_answer:
      option: C
      steps:
        - '$12 \times 1 = 12$, $12 \times 2 = 24$'
        - '$12 \times 3 = 36$, $12 \times 4 = 48$'
        - '$12,\ 24,\ 36,\ 48$'
  - id: fmp-03
    year_group: 8
    stem: 'What is the highest common factor (HCF) of $12$ and $18$?'
    options:
      A: '$2$'
      B: '$6$'
      C: '$36$'
      D: '$216$'
    correct: B
    misconceptions:
      A:
        label: 'Gives the lowest common factor above 1'
        explanation: 'Finds a common factor but stops at the smallest one.'
      C:
        label: 'Confuses HCF with LCM'
        explanation: 'Finds the lowest common multiple instead.'
      D:
        label: 'Multiplies the two numbers'
        explanation: 'Thinks multiplying 12 x 18 combines their factors.'
    worked_answer:
      option: C
      steps:
        - '12: $12,\ 24,\ 36$'
        - '18: $18,\ 36$'
        - 'Both lists have $36$'
        - '$36$'
  - id: fmp-04
    year_group: 8
    stem: 'What is the lowest common multiple (LCM) of $6$ and $8$?'
    options:
      A: '$24$'
      B: '$48$'
      C: '$2$'
      D: '$8$'
    correct: A
    misconceptions:
      B:
        label: 'Always multiplies the two numbers for the LCM'
        explanation: '6 x 8 is a common multiple, but not the lowest one.'
      C:
        label: 'Confuses LCM with HCF'
        explanation: 'Gives the highest common factor instead of a multiple.'
      D:
        label: 'Assumes the larger number is the LCM'
        explanation: 'Assumes the larger number is always a multiple of the smaller.'
    worked_answer:
      option: B
      steps:
        - 'LCM of $6$ and $8$'
        - '$6 \times 8 = 48$'
        - '$48$'
  - id: fmp-05
    year_group: 9
    stem: 'Which shows $60$ written as a product of its prime factors?'
    options:
      A: '$2 \times 3 \times 5$'
      B: '$2^2 \times 3 \times 5$'
      C: '$4 \times 3 \times 5$'
      D: '$1 \times 2^2 \times 3 \times 5$'
    correct: B
    misconceptions:
      A:
        label: 'Lists each prime factor only once'
        explanation: 'Leaves out the repeated factor of 2; 2 x 3 x 5 = 30.'
      C:
        label: 'Includes a factor that is not prime'
        explanation: 'Stops splitting at 4, which is not prime.'
      D:
        label: 'Treats 1 as a prime factor'
        explanation: 'Includes 1, which is not prime.'
    worked_answer:
      option: C
      steps:
        - '$60 = 4 \times 15$'
        - '$15 = 3 \times 5$'
        - '$4 \times 3 \times 5$'
