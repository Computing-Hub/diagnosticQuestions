strand: Geometry & measures
topic: Transformations
order: 6
questions:
  - id: tr-01
    year_group: 7
    stem: 'The point $(2, 4)$ is translated by the vector $\begin{pmatrix} 3 \\ -2 \end{pmatrix}$. Where does it end up?'
    options:
      A: '$(0, 7)$'
      B: '$(5, 6)$'
      C: '$(5, 2)$'
      D: '$(-1, 6)$'
    correct: C
    misconceptions:
      A:
        label: 'Reads the vector the wrong way round'
        explanation: 'Moves −2 in x and 3 in y; the top number is the horizontal move.'
      B:
        label: 'Ignores the negative sign in the vector'
        explanation: 'Moves up 2 instead of down 2.'
      D:
        label: 'Translates in the opposite direction'
        explanation: 'Subtracts the vector: moves left 3 and up 2.'
    worked_answer:
      option: A
      steps:
        - 'Move $-2$ across and $3$ up'
        - '$(2 - 2,\ 4 + 3)$'
        - '$(0, 7)$'

  - id: tr-02
    year_group: 8
    stem: 'The point $(1, 4)$ is reflected in the line $x = 3$. Where is its image?'
    options:
      A: '$(5, 4)$'
      B: '$(1, 2)$'
      C: '$(-1, 4)$'
      D: '$(4, 1)$'
    correct: A
    misconceptions:
      B:
        label: 'Thinks x = 3 is a horizontal line'
        explanation: 'Reflects in y = 3; the line x = 3 is vertical.'
      C:
        label: 'Reflects in the y-axis instead'
        explanation: 'Ignores the given mirror line and just changes the sign of x.'
      D:
        label: 'Swaps the coordinates'
        explanation: 'Swapping x and y reflects in y = x, not in x = 3.'
    worked_answer:
      option: B
      steps:
        - 'The line $x = 3$ goes through $(0, 3)$, $(1, 3)$ and $(2, 3)$'
        - '$(1, 4)$ is $1$ unit from the line, so the image is $1$ unit on the other side'
        - '$(1, 2)$'

  - id: tr-03
    year_group: 9
    stem: 'The point $(3, 1)$ is rotated $90^\circ$ clockwise about the origin. Where is its image?'
    options:
      A: '$(-1, 3)$'
      B: '$(-3, -1)$'
      C: '$(1, 3)$'
      D: '$(1, -3)$'
    correct: D
    misconceptions:
      A:
        label: 'Rotates anticlockwise instead of clockwise'
        explanation: '(−1, 3) is the result of a 90° anticlockwise turn.'
      B:
        label: 'Rotates 180° instead of 90°'
        explanation: 'Changes both signs, which is a half turn.'
      C:
        label: 'Swaps coordinates without changing a sign'
        explanation: 'Swapping alone is a reflection in y = x, not a rotation.'
    worked_answer:
      option: C
      steps:
        - 'Turning $90^\circ$ swaps the coordinates'
        - '$(3, 1) \to (1, 3)$'
        - '$(1, 3)$'

  - id: tr-04
    year_group: 9
    stem: 'Point $P$ is enlarged by scale factor $2$, centre $Q$. What are the coordinates of the image of $P$?'
    image: diagrams/transformations-04.svg
    image_alt: 'A coordinate grid from 0 to 7. Point Q is at (1, 1) and point P is at (3, 2).'
    options:
      A: '$(6, 4)$'
      B: '$(5, 3)$'
      C: '$(5, 4)$'
      D: '$(7, 4)$'
    correct: B
    misconceptions:
      A:
        label: 'Enlarges from the origin, ignoring the centre'
        explanation: 'Doubles the coordinates of P instead of doubling its distance from Q.'
      C:
        label: 'Adds the scale factor to each coordinate'
        explanation: 'Adds 2 to x and y instead of multiplying the distance from Q by 2.'
      D:
        label: 'Measures the doubled distance from P, not Q'
        explanation: 'Doubles the move from Q to P to get 4 right, 2 up, but counts it from P instead of from Q.'
    worked_answer:
      option: A
      steps:
        - 'Scale factor $2$, so multiply the coordinates of $P$ by $2$'
        - '$(3 \times 2,\ 2 \times 2)$'
        - '$(6, 4)$'

  - id: tr-05
    year_group: 7
    stem: 'Which vector describes the translation from shape P to shape Q?'
    image: diagrams/transformations-05.svg
    image_alt: 'A coordinate grid. Triangle P has vertices (1, 1), (3, 1) and (1, 2). Triangle Q is the same shape with vertices (4, 3), (6, 3) and (4, 4).'
    options:
      A: '$\begin{pmatrix} 2 \\ 3 \end{pmatrix}$'
      B: '$\begin{pmatrix} -3 \\ -2 \end{pmatrix}$'
      C: '$\begin{pmatrix} 3 \\ 2 \end{pmatrix}$'
      D: '$\begin{pmatrix} 4 \\ 3 \end{pmatrix}$'
    correct: C
    misconceptions:
      A:
        label: 'Writes the vector with x and y swapped'
        explanation: 'The top number is the horizontal move (3 right), the bottom the vertical (2 up).'
      B:
        label: 'Describes the move from Q back to P'
        explanation: 'Reverses the direction; P to Q is right and up, so both are positive.'
      D:
        label: 'Gives a coordinate of Q, not the movement'
        explanation: '(4, 3) is where a corner of Q is; the vector is how far each point moves.'
    worked_answer:
      option: D
      steps:
        - 'Shape $Q$ has a corner at $(4, 3)$'
        - 'So the vector is'
        - '$\begin{pmatrix} 4 \\ 3 \end{pmatrix}$'
