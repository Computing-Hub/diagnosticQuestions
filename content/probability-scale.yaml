strand: Probability
topic: Probability scale
order: 1
questions:
  - id: psc-01
    year_group: 7
    stem: 'What is the probability of rolling a 7 on an ordinary six-sided dice?'
    options:
      A: '$\frac{1}{7}$'
      B: '$0$'
      C: '$1$'
      D: '$-1$'
    correct: B
    misconceptions:
      A:
        label: 'Counts the event as one of the outcomes'
        explanation: 'Treats 7 as one extra possible outcome out of 7, when it cannot happen at all.'
      C:
        label: 'Confuses the ends of the scale'
        explanation: 'Thinks 1 means impossible; 1 means certain and 0 means impossible.'
      D:
        label: 'Thinks impossible events are negative'
        explanation: 'Probabilities are never below 0; impossible is exactly 0.'
    worked_answer:
      option: A
      steps:
        - 'A dice has 6 numbers, and 7 makes 7 outcomes'
        - 'Rolling a 7 is 1 of the 7'
        - '$\frac{1}{7}$'

  - id: psc-02
    year_group: 7
    stem: 'The scale is split into equal parts. What probability does the arrow show?'
    image: diagrams/probability-scale-02.svg
    image_alt: 'A probability scale from 0 to 1 divided into 5 equal parts. The arrow points to the third mark after 0.'
    options:
      A: '$0.3$'
      B: '$3$'
      C: '$0.6$'
      D: '$0.4$'
    correct: C
    misconceptions:
      A:
        label: 'Assumes every mark is worth 0.1'
        explanation: 'Counts 3 marks as tenths without checking there are only 5 parts, each worth 0.2.'
      B:
        label: 'Gives the number of marks, not the value'
        explanation: 'Counts the marks from 0 and gives 3, which cannot be a probability.'
      D:
        label: 'Reads the scale from the wrong end'
        explanation: 'Counts 2 parts back from 1 and gives the distance from 1 (0.4) instead of from 0.'
    worked_answer:
      option: D
      steps:
        - 'The arrow is 2 parts away from 1'
        - 'Each part is 0.2, so $2 \times 0.2 = 0.4$'
        - '$0.4$'

  - id: psc-03
    year_group: 8
    stem: 'Which of these cannot be a probability?'
    options:
      A: '$0$'
      B: '$1$'
      C: '$70\%$'
      D: '$\frac{3}{2}$'
    correct: D
    misconceptions:
      A:
        label: 'Thinks 0 is not a probability'
        explanation: 'An impossible event has probability 0, so 0 is allowed.'
      B:
        label: 'Thinks probabilities must be less than 1'
        explanation: 'A certain event has probability 1, so 1 is allowed.'
      C:
        label: 'Thinks probabilities cannot be percentages'
        explanation: '70% is the same as 0.7, which is a valid probability.'
    worked_answer:
      option: B
      steps:
        - 'Probabilities are things like $0.2$, $0.5$, $0.9$'
        - 'You can get close to $1$ but never reach it'
        - 'So $1$ cannot be a probability'
        - '$1$'

  - id: psc-04
    year_group: 8
    stem: 'The probability that it rains tomorrow is $0.3$. What is the probability that it does not rain tomorrow?'
    options:
      A: '$0.7$'
      B: '$-0.3$'
      C: '$0.3$'
      D: '$1.3$'
    correct: A
    misconceptions:
      B:
        label: 'Uses a minus sign for not'
        explanation: 'Writes the negative of 0.3; probabilities cannot be negative. Use 1 − 0.3.'
      C:
        label: 'Thinks not happening has the same probability'
        explanation: 'Assumes an event and its opposite are equally likely.'
      D:
        label: 'Adds to 1 instead of subtracting'
        explanation: 'Works out 1 + 0.3; the two probabilities must add up to 1.'
    worked_answer:
      option: D
      steps:
        - 'P(not rain) $= 1 + 0.3$'
        - '$1.3$'

  - id: psc-05
    year_group: 7
    stem: 'A bag has 3 red counters and 1 blue counter. One counter is picked at random. What is the probability it is red?'
    options:
      A: '$\frac{1}{2}$'
      B: '$\frac{3}{1}$'
      C: '$\frac{3}{4}$'
      D: '$\frac{1}{4}$'
    correct: C
    misconceptions:
      A:
        label: 'Thinks two colours means a 50:50 chance'
        explanation: 'Treats red and blue as equally likely because there are two colours.'
      B:
        label: 'Writes red over blue, not red over the total'
        explanation: 'Uses the ratio red : blue as the probability; the denominator should be all 4 counters.'
      D:
        label: 'Gives the probability of the other colour'
        explanation: 'Finds the probability of blue (1 out of 4) instead of red.'
    worked_answer:
      option: B
      steps:
        - '3 red and 1 blue'
        - 'P(red) $= \frac{3}{1}$'
        - '$\frac{3}{1}$'

  - id: psc-06
    year_group: 8
    stem: 'A spinner can land on red, blue or green. $P(\text{red}) = 0.35$ and $P(\text{blue}) = 0.4$. What is $P(\text{green})$?'
    options:
      A: '$0.25$'
      B: '$0.75$'
      C: '$0.65$'
      D: '$0.05$'
    correct: A
    misconceptions:
      B:
        label: 'Gives the total of the known probabilities'
        explanation: 'Works out $0.35 + 0.4 = 0.75$ and stops; that is $P(\text{red or blue})$, so green is $1 - 0.75$.'
      C:
        label: 'Subtracts only one probability from 1'
        explanation: 'Works out $1 - 0.35 = 0.65$, forgetting that blue also has to be taken away.'
      D:
        label: 'Finds the difference between the two probabilities'
        explanation: 'Works out $0.4 - 0.35 = 0.05$; the three probabilities must add up to 1.'
    worked_answer:
      option: C
      steps:
        - '$P(\text{green}) = 1 - P(\text{red})$'
        - '$1 - 0.35 = 0.65$'
        - '$0.65$'
