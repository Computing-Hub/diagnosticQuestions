strand: Geometry & measures
topic: Vectors
key_stage: KS4
tier: foundation
order: 2
questions:
  - id: vec-01
    year_group: 10
    stem: '$\mathbf{a} = \begin{pmatrix} 3 \\ -2 \end{pmatrix}$ and $\mathbf{b} = \begin{pmatrix} -1 \\ 5 \end{pmatrix}$. What is $\mathbf{a} + \mathbf{b}$?'
    options:
      A: '$\begin{pmatrix} 4 \\ -7 \end{pmatrix}$'
      B: '$\begin{pmatrix} 2 \\ 3 \end{pmatrix}$'
      C: '$\begin{pmatrix} 8 \\ -3 \end{pmatrix}$'
      D: '$\begin{pmatrix} -3 \\ -10 \end{pmatrix}$'
    correct: B
    misconceptions:
      A:
        label: 'Subtracts the vectors instead of adding'
        explanation: 'Works out $3 - (-1) = 4$ and $-2 - 5 = -7$, which is $\mathbf{a} - \mathbf{b}$.'
      C:
        label: 'Adds the top of one vector to the bottom of the other'
        explanation: 'Works out $3 + 5$ and $-2 + (-1)$; add top to top and bottom to bottom.'
      D:
        label: 'Multiplies the components instead of adding'
        explanation: 'Works out $3 \times (-1)$ and $-2 \times 5$; adding vectors means adding matching components.'
    worked_answer:
      option: C
      steps:
        - 'Top: $3 + 5 = 8$'
        - 'Bottom: $-2 + (-1) = -3$'
        - '$\begin{pmatrix} 8 \\ -3 \end{pmatrix}$'

  - id: vec-02
    year_group: 10
    stem: '$\mathbf{a} = \begin{pmatrix} 4 \\ -1 \end{pmatrix}$. What is $3\mathbf{a}$?'
    options:
      A: '$\begin{pmatrix} 7 \\ 2 \end{pmatrix}$'
      B: '$\begin{pmatrix} 12 \\ -1 \end{pmatrix}$'
      C: '$\begin{pmatrix} 12 \\ 3 \end{pmatrix}$'
      D: '$\begin{pmatrix} 12 \\ -3 \end{pmatrix}$'
    correct: D
    misconceptions:
      A:
        label: 'Adds the scalar instead of multiplying'
        explanation: 'Works out $4 + 3$ and $-1 + 3$; $3\mathbf{a}$ means $3 \times$ each component.'
      B:
        label: 'Multiplies only the top component'
        explanation: 'Multiplies $4$ by $3$ but leaves $-1$; both components are multiplied by $3$.'
      C:
        label: 'Thinks multiplying a negative gives a positive'
        explanation: 'Works out $3 \times (-1) = 3$; a positive times a negative is negative, $-3$.'
    worked_answer:
      option: B
      steps:
        - '$3\mathbf{a}$ means $3 \times 4$ on top'
        - '$3 \times 4 = 12$, the bottom stays $-1$'
        - '$\begin{pmatrix} 12 \\ -1 \end{pmatrix}$'

  - id: vec-03
    year_group: 11
    stem: '$A$ is the point $(2, 5)$ and $B$ is the point $(7, 1)$. What is the column vector $\overrightarrow{AB}$?'
    options:
      A: '$\begin{pmatrix} -5 \\ 4 \end{pmatrix}$'
      B: '$\begin{pmatrix} 9 \\ 6 \end{pmatrix}$'
      C: '$\begin{pmatrix} 5 \\ -4 \end{pmatrix}$'
      D: '$\begin{pmatrix} 7 \\ 1 \end{pmatrix}$'
    correct: C
    misconceptions:
      A:
        label: 'Subtracts the end point from the start point'
        explanation: 'Works out $A - B$, which is $\overrightarrow{BA}$; $\overrightarrow{AB}$ is $B - A$: $7 - 2 = 5$ and $1 - 5 = -4$.'
      B:
        label: 'Adds the coordinates'
        explanation: 'Works out $2 + 7$ and $5 + 1$; the vector is the change from $A$ to $B$, so subtract.'
      D:
        label: 'Gives the coordinates of the end point'
        explanation: 'Writes $B$ as a column vector; that is the journey from the origin to $B$, not from $A$ to $B$.'
    worked_answer:
      option: A
      steps:
        - 'Across: $2 - 7 = -5$'
        - 'Up: $5 - 1 = 4$'
        - '$\begin{pmatrix} -5 \\ 4 \end{pmatrix}$'

  - id: vec-04
    year_group: 11
    stem: '$\mathbf{a} = \begin{pmatrix} 5 \\ 2 \end{pmatrix}$ and $\mathbf{b} = \begin{pmatrix} 3 \\ -1 \end{pmatrix}$. What is $\mathbf{a} - 2\mathbf{b}$?'
    options:
      A: '$\begin{pmatrix} -1 \\ 4 \end{pmatrix}$'
      B: '$\begin{pmatrix} 11 \\ 0 \end{pmatrix}$'
      C: '$\begin{pmatrix} 2 \\ 3 \end{pmatrix}$'
      D: '$\begin{pmatrix} -1 \\ 0 \end{pmatrix}$'
    correct: A
    misconceptions:
      B:
        label: 'Adds instead of subtracting'
        explanation: 'Works out $\mathbf{a} + 2\mathbf{b}$: $5 + 6 = 11$ and $2 + (-2) = 0$.'
      C:
        label: 'Ignores the scalar 2'
        explanation: 'Works out $\mathbf{a} - \mathbf{b}$; $\mathbf{b}$ must be doubled to $\begin{pmatrix} 6 \\ -2 \end{pmatrix}$ first.'
      D:
        label: 'Treats subtracting a negative as subtracting'
        explanation: 'Works out $2 - (-2) = 0$; subtracting a negative is adding, so $2 - (-2) = 4$.'
    worked_answer:
      option: D
      steps:
        - '$2\mathbf{b} = \begin{pmatrix} 6 \\ -2 \end{pmatrix}$'
        - 'Top: $5 - 6 = -1$'
        - 'Bottom: $2 - (-2) = 0$'
        - '$\begin{pmatrix} -1 \\ 0 \end{pmatrix}$'

  - id: vec-05
    year_group: 10
    stem: '$\overrightarrow{AB} = \begin{pmatrix} 3 \\ -2 \end{pmatrix}$. What is $\overrightarrow{BA}$?'
    options:
      A: '$\begin{pmatrix} 3 \\ -2 \end{pmatrix}$'
      B: '$\begin{pmatrix} -3 \\ -2 \end{pmatrix}$'
      C: '$\begin{pmatrix} -2 \\ 3 \end{pmatrix}$'
      D: '$\begin{pmatrix} -3 \\ 2 \end{pmatrix}$'
    correct: D
    misconceptions:
      A:
        label: 'Thinks direction does not matter'
        explanation: 'Gives the same vector; going from $B$ to $A$ is the opposite journey, so both signs change.'
      B:
        label: 'Makes every component negative'
        explanation: 'Puts a minus sign on both numbers; $-(-2) = 2$, so the bottom becomes positive.'
      C:
        label: 'Reverses the order of the components'
        explanation: 'Swaps the top and bottom numbers; reversing the direction keeps the order and changes each sign.'
    worked_answer:
      option: B
      steps:
        - '$\overrightarrow{BA}$ goes the other way, so make it negative'
        - 'Top: $-3$, bottom: $-2$'
        - '$\begin{pmatrix} -3 \\ -2 \end{pmatrix}$'
