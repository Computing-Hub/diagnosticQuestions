<div class="data-bar" role="group" aria-label="Your data file">
  <span class="unsaved" data-store-status hidden>Changes not saved to a file yet</span>
  <button type="button" class="btn btn-small" data-download title="Save your quiz sets and tallies to a file on the USB stick">Download data</button>
  <label class="btn btn-small" title="Load a data file you downloaded before">Load data<input type="file" accept=".json,application/json" data-load></label>
  <span class="hint" data-load-status role="status"></span>
</div>
