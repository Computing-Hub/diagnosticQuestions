<g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif">
<line x1="60" y1="120" x2="560" y2="120" />
<line x1="60" y1="300" x2="560" y2="300" />
<line x1="226.1" y1="54.2" x2="339.5" y2="365.8" />
<polyline points="474.5,125.8 485,120 474.5,114.2"/>
<polyline points="474.5,305.8 485,300 474.5,294.2"/>
<path d="M 268.8 171.7 A 55 55 0 0 0 305 120" />
<path d="M 360.5 300 A 45 45 0 0 0 300.1 257.7" />
