<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img">
<title>A trapezium with parallel sides 6 cm and 10 cm and a dashed perpendicular height of 5 cm</title>
<rect x="0" y="0" width="520" height="380" fill="#ffffff"/>
<g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif">
<polygon points="70,320 430,320 358,140 142,140" />
<line x1="142" y1="140" x2="142" y2="320" stroke-dasharray="10 8"/>
<polyline points="160,320 160,302 142,302"/>
<polyline points="250.3,145.8 260.8,140 250.3,134.2"/>
<polyline points="257.5,325.8 268,320 257.5,314.2"/>
<text x="250" y="352" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >10 cm</text>
<text x="250" y="114" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >6 cm</text>
<text x="177" y="250" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >5 cm</text>
</g>
<g font-family="sans-serif" fill="#000000"><text x="510" y="370" font-size="18" text-anchor="end" font-style="italic">Not drawn to scale</text></g>
</svg>
