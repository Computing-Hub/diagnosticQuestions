<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img">
<title>Three lines meeting at a point, making angles of 70 degrees, 80 degrees and x</title>
<rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
<g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif">
<line x1="300" y1="200" x2="520" y2="200" />
<line x1="300" y1="200" x2="358.1" y2="40.3" />
<line x1="300" y1="200" x2="109.5" y2="90" />
<path d="M 360 200 A 60 60 0 0 0 320.5 143.6" />
<path d="M 317.1 153 A 50 50 0 0 0 256.7 175" />
<path d="M 265.4 180 A 40 40 0 1 0 340 200" />
<text x="377.8" y="145.5" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >70°</text>
<text x="270.9" y="120.1" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >80°</text>
<text x="280.6" y="272.4" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >x</text>
</g>
<g font-family="sans-serif" fill="#000000"><text x="590" y="390" font-size="18" text-anchor="end" font-style="italic">Not drawn to scale</text></g>
</svg>
