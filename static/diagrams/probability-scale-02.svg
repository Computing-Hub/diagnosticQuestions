<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img">
  <title>A probability scale from 0 to 1 split into 5 equal parts, with an arrow at the third mark from 0</title>
  <rect width="600" height="200" fill="#ffffff"/>
  <g stroke="#000000" stroke-width="3" fill="none">
    <line x1="50" y1="120" x2="550" y2="120"/>
    <line x1="50" y1="105" x2="50" y2="135"/>
    <line x1="150" y1="108" x2="150" y2="132"/>
    <line x1="250" y1="108" x2="250" y2="132"/>
    <line x1="350" y1="108" x2="350" y2="132"/>
    <line x1="450" y1="108" x2="450" y2="132"/>
    <line x1="550" y1="105" x2="550" y2="135"/>
    <line x1="350" y1="30" x2="350" y2="96"/>
  </g>
  <polygon points="338,88 362,88 350,106" fill="#000000"/>
  <g font-family="sans-serif" font-size="28" fill="#000000" text-anchor="middle">
    <text x="50" y="170">0</text>
    <text x="550" y="170">1</text>
  </g>
</svg>
