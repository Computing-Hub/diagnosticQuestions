<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img">
<title>A cuboid measuring 5 cm by 3 cm by 2 cm</title>
<rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
<g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif">
<polygon points="80,140 380,140 380,270 80,270" />
<line x1="80" y1="140" x2="190" y2="60" />
<line x1="380" y1="140" x2="490" y2="60" />
<line x1="380" y1="270" x2="490" y2="190" />
<line x1="190" y1="60" x2="490" y2="60" />
<line x1="490" y1="60" x2="490" y2="190" />
<line x1="80" y1="270" x2="190" y2="190" stroke-dasharray="8 7"/>
<line x1="190" y1="190" x2="190" y2="60" stroke-dasharray="8 7"/>
<line x1="190" y1="190" x2="490" y2="190" stroke-dasharray="8 7"/>
<text x="230" y="300" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >5 cm</text>
<text x="68" y="205" font-size="26" text-anchor="end" dominant-baseline="middle" fill="#000000" stroke="none" >2 cm</text>
<text x="455" y="257.5" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >3 cm</text>
</g>
<g font-family="sans-serif" fill="#000000"><text x="550" y="320" font-size="18" text-anchor="end" font-style="italic">Not drawn to scale</text></g>
</svg>
