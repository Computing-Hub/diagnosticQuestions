<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img">
<title>A right-angled triangle with shorter sides 6 cm and 8 cm and hypotenuse x</title>
<rect x="0" y="0" width="500" height="400" fill="#ffffff"/>
<g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif">
<polygon points="90,340 410,340 90,100" />
<polyline points="112,340 112,318 90,318"/>
<text x="250" y="372" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >8 cm</text>
<text x="50" y="220" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >6 cm</text>
<text x="268" y="196" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" font-style="italic">x</text>
</g>
<g font-family="sans-serif" fill="#000000"><text x="490" y="390" font-size="18" text-anchor="end" font-style="italic">Not drawn to scale</text></g>
</svg>
