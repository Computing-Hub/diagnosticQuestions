<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img">
  <title>Four graphs labelled A to D. A: straight line crossing the y-axis above the origin. B: decreasing curve. C: straight line through the origin. D: curve starting at the origin and getting steeper.</title>
  <rect width="600" height="520" fill="#ffffff"/>
  <defs>
    <g id="axes">
      <rect x="0" y="0" width="280" height="240" fill="none" stroke="#000000" stroke-width="2"/>
      <line x1="50" y1="210" x2="260" y2="210" stroke="#000000" stroke-width="3"/>
      <line x1="50" y1="210" x2="50" y2="40" stroke="#000000" stroke-width="3"/>
      <text x="36" y="232" font-family="sans-serif" font-size="22">O</text>
      <text x="262" y="232" font-family="sans-serif" font-size="22">x</text>
      <text x="30" y="52" font-family="sans-serif" font-size="22">y</text>
    </g>
  </defs>
  <g transform="translate(10,10)">
    <use href="#axes"/>
    <text x="120" y="34" font-family="sans-serif" font-size="26" font-weight="bold">Graph A</text>
    <line x1="50" y1="150" x2="250" y2="60" stroke="#000000" stroke-width="4"/>
  </g>
  <g transform="translate(310,10)">
    <use href="#axes"/>
    <text x="120" y="34" font-family="sans-serif" font-size="26" font-weight="bold">Graph B</text>
    <path d="M 70 50 Q 100 190 250 195" stroke="#000000" stroke-width="4" fill="none"/>
  </g>
  <g transform="translate(10,270)">
    <use href="#axes"/>
    <text x="120" y="34" font-family="sans-serif" font-size="26" font-weight="bold">Graph C</text>
    <line x1="50" y1="210" x2="250" y2="60" stroke="#000000" stroke-width="4"/>
  </g>
  <g transform="translate(310,270)">
    <use href="#axes"/>
    <text x="120" y="34" font-family="sans-serif" font-size="26" font-weight="bold">Graph D</text>
    <path d="M 50 210 Q 170 210 250 50" stroke="#000000" stroke-width="4" fill="none"/>
  </g>
</svg>
