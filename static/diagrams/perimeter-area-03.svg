<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img">
<title>A parallelogram with base 9 cm, sloping side 5 cm and a dashed perpendicular height of 4 cm</title>
<rect x="0" y="0" width="600" height="360" fill="#ffffff"/>
<g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif">
<polygon points="60,300 420,300 540,140 180,140" />
<line x1="180" y1="140" x2="180" y2="300" stroke-dasharray="10 8"/>
<polyline points="198,300 198,282 180,282"/>
<text x="240" y="332" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >9 cm</text>
<text x="215" y="245" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >4 cm</text>
<text x="94.4" y="200.8" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >5 cm</text>
</g>
<g font-family="sans-serif" fill="#000000"><text x="590" y="350" font-size="18" text-anchor="end" font-style="italic">Not drawn to scale</text></g>
</svg>
