<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img">
<title>A cylinder with radius 3 cm and height 5 cm</title>
<rect x="0" y="0" width="500" height="400" fill="#ffffff"/>
<g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif">
<ellipse cx="250" cy="90" rx="130" ry="40"/>
<line x1="120" y1="90" x2="120" y2="330" />
<line x1="380" y1="90" x2="380" y2="330" />
<path d="M 120 330 A 130 40 0 0 0 380 330"/>
<path d="M 120 330 A 130 40 0 0 1 380 330" stroke-dasharray="8 7"/>
<line x1="250" y1="90" x2="380" y2="90" />
<circle cx="250" cy="90" r="4" fill="#000000"/>
<text x="315" y="72" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >3 cm</text>
<text x="430" y="210" font-size="26" text-anchor="middle" dominant-baseline="middle" fill="#000000" stroke="none" >5 cm</text>
</g>
<g font-family="sans-serif" fill="#000000"><text x="490" y="390" font-size="18" text-anchor="end" font-style="italic">Not drawn to scale</text></g>
</svg>
