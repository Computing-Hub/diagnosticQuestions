<line x1="90" y1="340.0" x2="570" y2="340.0" stroke="#ccc" stroke-width="1.5"/>
<text x="78" y="348.0" font-family="sans-serif" font-size="22" text-anchor="end" fill="#000">0</text>
<line x1="90" y1="297.1" x2="570" y2="297.1" stroke="#ccc" stroke-width="1.5"/>
<text x="78" y="305.1" font-family="sans-serif" font-size="22" text-anchor="end" fill="#000">2</text>
<line x1="90" y1="254.3" x2="570" y2="254.3" stroke="#ccc" stroke-width="1.5"/>
<text x="78" y="262.3" font-family="sans-serif" font-size="22" text-anchor="end" fill="#000">4</text>
<line x1="90" y1="211.4" x2="570" y2="211.4" stroke="#ccc" stroke-width="1.5"/>
<text x="78" y="219.4" font-family="sans-serif" font-size="22" text-anchor="end" fill="#000">6</text>
<line x1="90" y1="168.6" x2="570" y2="168.6" stroke="#ccc" stroke-width="1.5"/>
<text x="78" y="176.6" font-family="sans-serif" font-size="22" text-anchor="end" fill="#000">8</text>
<line x1="90" y1="125.7" x2="570" y2="125.7" stroke="#ccc" stroke-width="1.5"/>
<text x="78" y="133.7" font-family="sans-serif" font-size="22" text-anchor="end" fill="#000">10</text>
<line x1="90" y1="82.9" x2="570" y2="82.9" stroke="#ccc" stroke-width="1.5"/>
<text x="78" y="90.9" font-family="sans-serif" font-size="22" text-anchor="end" fill="#000">12</text>
<line x1="90" y1="40.0" x2="570" y2="40.0" stroke="#ccc" stroke-width="1.5"/>
<text x="78" y="48.0" font-family="sans-serif" font-size="22" text-anchor="end" fill="#000">14</text>
<rect x="115.0" y="125.7" width="70" height="214.3" fill="#9a9a9a" stroke="#000" stroke-width="2"/>
<text x="150" y="370" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#000">Football</text>
