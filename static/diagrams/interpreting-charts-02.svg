<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" role="img">
<title>Bar chart of favourite sport. Vertical axis goes up in 2s from 0 to 14. Football 10, Swimming bar ends halfway between 6 and 8, Tennis 4, Netball 12</title>
