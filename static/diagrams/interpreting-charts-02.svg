<text x="270" y="370" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#000">Swimming</text>
<rect x="355.0" y="254.3" width="70" height="85.7" fill="#9a9a9a" stroke="#000" stroke-width="2"/>
<text x="390" y="370" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#000">Tennis</text>
<rect x="475.0" y="82.9" width="70" height="257.1" fill="#9a9a9a" stroke="#000" stroke-width="2"/>
<text x="510" y="370" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#000">Netball</text>
<line x1="90" y1="340" x2="570" y2="340" stroke="#000" stroke-width="2.5"/>
<line x1="90" y1="340" x2="90" y2="30" stroke="#000" stroke-width="2.5"/>
<text x="26" y="190.0" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#000" transform="rotate(-90 26 190.0)">Number of students</text>
